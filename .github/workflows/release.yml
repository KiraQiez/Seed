name: Release packaging

on:
  push:
    branches: [staging]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  quality:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/quality.yml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - name: Verify source ref
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$(git rev-parse "$GITHUB_SHA^{commit}")" = "$(git rev-parse refs/remotes/origin/main)"
          fi
      - name: Build and verify the release
        shell: bash
        run: |
          uv export --locked --only-group build --no-emit-project --quiet \
            --output-file "$RUNNER_TEMP/seed-build-constraints.txt"
          uv build --no-create-gitignore --build-constraints "$RUNNER_TEMP/seed-build-constraints.txt" \
            --require-hashes --out-dir release-dist
          uv run --locked python scripts/release_artifacts.py release-dist --notes release-notes.md
          uvx --from twine==7.0.0 twine check --strict release-dist/*.whl release-dist/*.tar.gz
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: distributions
          path: release-dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  install:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: distributions
          path: release-dist/
      - run: uv run --locked python scripts/release_artifacts.py release-dist
      - run: uv run --locked python tests/package_smoke.py --tools release-dist

  database:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      UV_PYTHON: "3.12"
      SEED_TEST_POSTGRES_MAJOR: "17"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: distributions
          path: release-dist/
      - run: uv run --locked python scripts/release_artifacts.py release-dist
      - run: uv pip install --reinstall --no-deps release-dist/*.whl
      - run: uv run --locked --no-sync pytest tests/integration tests/e2e

  homebrew:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-24.04]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - uses: Homebrew/actions/setup-homebrew@b4c226ae32acab42c7c2c0745ad224a1e9958022
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: distributions
          path: release-dist/
      - name: Install and test the candidate tap
        shell: bash
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/seed-brew-config
        run: |
          uv run --locked python scripts/release_artifacts.py release-dist
          tap="$RUNNER_TEMP/seed-tap"
          lock="$RUNNER_TEMP/pylock.toml"
          mkdir -p "$tap/Formula"
          uv export --locked --no-dev --group build --no-emit-project --quiet \
            --format pylock.toml --output-file "$lock"
          uv run --locked python scripts/render_homebrew.py release-dist/*.tar.gz "$lock" \
            "$tap/Formula/seed.rb"
          ruby -c "$tap/Formula/seed.rb"
          git -C "$tap" init --quiet
          git -C "$tap" add Formula/seed.rb
          git -C "$tap" -c user.name="Seed CI" -c user.email="seed-ci@example.invalid" commit -qm "Add candidate formula"
          brew tap --custom-remote seed-ci/tap "file://$tap"
          brew trust --formula seed-ci/tap/seed
          brew install --build-from-source seed-ci/tap/seed
          brew test seed-ci/tap/seed

  publish-pypi:
    if: github.repository == 'KiraQiez/Seed' && startsWith(github.ref, 'refs/tags/v')
    needs: [quality, install, database, homebrew]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/seed-dev-db/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: distributions
          path: release-dist/
      - name: Verify and stage package files
        working-directory: release-dist
        run: |
          sha256sum --strict --check SHA256SUMS
          mkdir ../dist
          cp -- *.whl *.tar.gz ../dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-github:
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: distributions
          path: release-dist/
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-notes
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd release-dist && sha256sum --strict --check SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Seed $GITHUB_REF_NAME" \
            --notes-file release-notes.md release-dist/*.whl release-dist/*.tar.gz release-dist/SHA256SUMS
