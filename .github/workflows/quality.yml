name: Quality

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
        include:
          - {os: macos-latest, python: "3.12"}
          - {os: macos-latest, python: "3.15"}
          - {os: windows-latest, python: "3.12"}
          - {os: windows-latest, python: "3.15"}
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.9'
      - run: uv python install "${{ matrix.python }}"
      - run: uv sync --locked
      - run: uv lock --check
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy src tests
      - run: uv run --locked pytest tests/unit
      - run: uv build --sdist --wheel
      - run: uv run --locked python tests/package_smoke.py dist

  integration:
    name: PostgreSQL ${{ matrix.postgres }} on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "16", "17", "18", "19"]
        python: ["3.12"]
        include:
          - {postgres: "19", python: "3.15"}
    env:
      SEED_TEST_POSTGRES_MAJOR: ${{ matrix.postgres }}
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.9'
      - run: uv sync --locked
      - run: uv build --wheel
      - run: uv pip install --reinstall --no-deps dist/*.whl
      - run: uv run --locked --no-sync pytest tests/integration tests/e2e

  benchmark:
    name: PostgreSQL 16 reference benchmark
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh tests/benchmark/run.sh
