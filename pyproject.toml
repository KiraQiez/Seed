[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seed"
dynamic = ["version"]
description = "Schema-aware synthetic data for development and testing"
readme = "README.md"
requires-python = ">=3.12"

[tool.hatch.version]
path = "src/seed/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/seed"]
