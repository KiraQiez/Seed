[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seed-dev-db"
dynamic = ["version"]
description = "Schema-aware synthetic data for development and testing"
readme = "docs/PYPI.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "KiraQiez"}]
requires-python = ">=3.12"
dependencies = [
    "faker>=40,<42",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "rich>=15.0.0",
    "sqlalchemy>=2.0,<2.1",
    "typer>=0.29.3,<0.30",
]

[project.urls]
Homepage = "https://github.com/KiraQiez/Seed"
Documentation = "https://github.com/KiraQiez/Seed#documentation"
Issues = "https://github.com/KiraQiez/Seed/issues"

[project.scripts]
seed = "seed.cli:main"

[tool.hatch.version]
path = "src/seed/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/seed"]

[tool.hatch.build.targets.sdist]
include = ["/src/seed", "/docs/PYPI.md", "/LICENSE", "/pyproject.toml"]

[dependency-groups]
build = ["hatchling"]
dev = [
    "packaging>=26,<27",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
