[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seed"
dynamic = ["version"]
description = "Schema-aware synthetic data for development and testing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faker>=40,<42",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
    "rich>=15.0.0",
    "sqlalchemy>=2.0,<2.1",
    "typer>=0.29.3,<0.30",
]

[project.scripts]
seed = "seed.cli:main"

[tool.hatch.version]
path = "src/seed/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/seed"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
