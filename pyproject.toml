[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seed"
dynamic = ["version"]
description = "Schema-aware synthetic data for development and testing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faker>=40,<42",
    "pydantic>=2,<3",
]

[tool.hatch.version]
path = "src/seed/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/seed"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
